name: Update Itinerary

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.user.login == 'margo-kor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update itinerary with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, sys

          html = open("index.html", encoding="utf-8").read()
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          request_text = f"{title}\n{body}".strip()

          prompt = f"""아래는 여행 일정 웹페이지의 전체 HTML입니다.
          사용자의 수정 요청에 따라 HTML을 수정해주세요.

          ## 수정 요청
          {request_text}

          ## 현재 HTML
          {html}

          ## 규칙
          - 수정된 전체 HTML만 출력하세요
          - <!DOCTYPE html>부터 </html>까지만 출력
          - 설명이나 마크다운 코드블록 없이 순수 HTML만
          - 기존 디자인, 스타일, 구조를 그대로 유지
          - 구글맵 링크는 https://maps.google.com/?q= 형식
          - 예약 링크가 있으면 chip-link 클래스로 추가
          - 한국어로 작성"""

          payload = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 20000,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f"API error: {e}", file=sys.stderr)
              sys.exit(1)

          new_html = data["content"][0]["text"]

          if "<!DOCTYPE html>" in new_html and "</html>" in new_html:
              start = new_html.index("<!DOCTYPE html>")
              end = new_html.index("</html>") + len("</html>")
              new_html = new_html[start:end]
              open("index.html", "w", encoding="utf-8").write(new_html)
              print("Updated successfully")
          else:
              print("Invalid response", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "update: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Close issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            -c "반영 완료! 1~2분 후 확인: https://margo-kor.github.io/europe-trip-2026/"

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -b "수정 실패. 요청을 좀 더 구체적으로 다시 작성해주세요."

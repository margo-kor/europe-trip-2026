name: Update Itinerary

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.user.login == 'margo-kor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update itinerary with Claude
        timeout-minutes: 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, sys

          html = open("index.html", encoding="utf-8").read()
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          request_text = f"{title}\n{body}".strip()

          prompt = (
              "아래 여행 일정 HTML을 수정해야 합니다.\n\n"
              "## 수정 요청\n"
              f"{request_text}\n\n"
              "## 현재 HTML\n"
              f"{html}\n\n"
              "## 응답 규칙\n"
              "JSON 배열로만 응답하세요. 각 항목은 교체 작업입니다:\n"
              '[{"old": "교체할 기존 문자열", "new": "새 문자열"}]\n\n'
              "- old: HTML에서 찾을 정확한 문자열 (고유하게 충분히 포함)\n"
              "- new: 교체할 새 문자열\n"
              "- 새 콘텐츠 삽입: old에 삽입 위치 앞 기존 코드, new에 기존코드+새코드\n"
              "- 기존 스타일/구조 유지, 구글맵은 https://maps.google.com/?q= 형식\n"
              "- JSON만 출력. 설명/코드블록(```) 절대 금지\n"
          )

          payload = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 4000,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-workspace-id": "wrkspc_01R2v5D2maP5gqj7CgkUX25H",
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              err_body = e.read().decode()
              print(f"API error {e.code}: {err_body}", file=sys.stderr)
              sys.exit(1)

          response_text = data["content"][0]["text"].strip()
          # Strip markdown code block if present
          if response_text.startswith("```"):
              response_text = response_text.split("\n", 1)[1]
              response_text = response_text.rsplit("```", 1)[0].strip()

          try:
              patches = json.loads(response_text)
          except json.JSONDecodeError:
              print(f"JSON parse error: {response_text[:500]}", file=sys.stderr)
              sys.exit(1)

          for i, patch in enumerate(patches):
              old = patch["old"]
              new = patch["new"]
              if old not in html:
                  print(f"Patch {i}: old string not found", file=sys.stderr)
                  sys.exit(1)
              html = html.replace(old, new, 1)

          open("index.html", "w", encoding="utf-8").write(html)
          print(f"Applied {len(patches)} patches successfully")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "update: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Close issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            -c "반영 완료! 1~2분 후 확인: https://margo-kor.github.io/europe-trip-2026/"

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -b "수정 실패. 요청을 좀 더 구체적으로 다시 작성해주세요."
